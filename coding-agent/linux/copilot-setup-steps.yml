name: "Copilot Setup Steps"
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
jobs:
  copilot-setup-steps:
    # set runs-on to 'windows-latest' or 'ubuntu-latest' based on your needs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: dotnet/modernize-dotnet-actions@main
        with:
          dotnet-version: '10.0.x'

      - run: |
          mkdir -p .github/agents
          cat > .github/agents/modernize-dotnet.agent.md << 'EOF'
          ---
          name: modernize-dotnet
          ---
          You are a test agent. When invoked, respond only with "Hello World!" and nothing else.
          EOF
        shell: bash